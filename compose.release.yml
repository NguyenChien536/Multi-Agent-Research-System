name: synthia-release

x-app: &app
  image: synthia-backend:${RELEASE_REVISION:-local}
  build:
    context: ./backend
    dockerfile: Dockerfile.release
    args:
      VCS_REF: ${RELEASE_REVISION:-local}
      VCS_URL: https://github.com/NguyenChien536/Multi-Agent-Research-System
  env_file:
    - ${RELEASE_ENV_FILE:?Run scripts/release.ps1 to initialize a private release environment}
  environment: &app-env
    ENVIRONMENT: production
    DEBUG: 'false'
    MOCK_PROVIDERS: 'false'
    DATABASE_URL: postgresql+asyncpg://research_user:${POSTGRES_PASSWORD:?required}@postgres:5432/research_db
    POSTGRES_SYNC_URL: postgresql://research_user:${POSTGRES_PASSWORD:?required}@postgres:5432/research_db
    REDIS_URL: redis://redis:6379/0
    ARTIFACTS_DIR: /app/storage/artifacts
    BACKEND_CORS_ORIGINS: '["http://127.0.0.1:${RELEASE_PORT:-3080}","http://localhost:${RELEASE_PORT:-3080}"]'
  volumes:
    - artifacts:/app/storage
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  init: true
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: research_user
      POSTGRES_DB: research_db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/release/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U research_user -d research_db']
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes', --maxmemory, 256mb, --maxmemory-policy, noeviction]
    volumes:
      - redisdata:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  migrate:
    <<: *app
    command: [alembic, upgrade, head]
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *app
    restart: unless-stopped
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, '8000', --proxy-headers, --forwarded-allow-ips, '*']
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s
    mem_limit: 1g

  worker:
    <<: *app
    restart: unless-stopped
    command: [sh, -c, 'python -m app.services.runtime_check && exec celery -A app.worker.celery_app worker --loglevel=info -E --concurrency=2']
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'celery -A app.worker.celery_app inspect ping -d "celery@$$HOSTNAME" --timeout 5 | grep -q pong']
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 40s
    mem_limit: 2g

  frontend:
    image: synthia-frontend:${RELEASE_REVISION:-local}
    build:
      context: ./frontend
      dockerfile: Dockerfile.release
      args:
        VCS_REF: ${RELEASE_REVISION:-local}
        NEXT_PUBLIC_API_URL: /api/v1
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 512m
    logging: *logging

  gateway:
    image: nginx:1.28-alpine
    labels:
      org.opencontainers.image.revision: ${RELEASE_REVISION:-local}
    user: '101:101'
    restart: unless-stopped
    ports:
      - '127.0.0.1:${RELEASE_PORT:-3080}:8080'
    volumes:
      - ./docker/release/nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      frontend:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/api/v1/ready']
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging

volumes:
  pgdata:
  redisdata:
  artifacts:
